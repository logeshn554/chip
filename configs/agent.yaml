# ─────────────────────────────────────────────
# Self-Evolving Chip Agent — Master Configuration
# ─────────────────────────────────────────────

# ── LLM ──────────────────────────────────────
llm:
  # "ollama" for local REST inference, "transformers" for local HF, "vllm" for OpenAI-compatible API
  backend: "ollama"
  model_name: "qwen3:4b"
  device_map: "auto"
  torch_dtype: "auto"
  max_new_tokens: 8192
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  enable_thinking: true
  timeout_seconds: 300.0

  ollama:
    base_url: "http://localhost:11434"

  vllm:
    base_url: "http://localhost:8000/v1"
    api_key: "EMPTY"

# ── Memory ───────────────────────────────────
memory:
  chroma_path: "./data/chroma"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  knowledge:
    collection: "hardware_knowledge"
    chunk_size: 512
    chunk_overlap: 64

  experience:
    collection: "hardware_experience"
    max_results: 10

  design:
    collection: "hardware_designs"
    designs_dir: "./designs"

  trajectory:
    store_dir: "./trajectories"
    format: "jsonl"

# ── Web Research & ScrapeGraphAI ─────────────
web:
  enabled: true
  search_backend: "targeted_research"
  scraper: "scrapegraphai"
  max_results: 5
  allowed_domains:
    - "arxiv.org"
    - "github.com"
    - "docs.cocotb.org"
    - "verilator.org"
    - "yosyshq.readthedocs.io"
    - "riscv.org"
    - "ieee.org"
    - "en.wikipedia.org"
  rate_limit_seconds: 2.0
  cache_enabled: true
  cache_dir: "./data/web_cache"
  timeout_seconds: 15.0

scraping:
  max_page_bytes: 250000
  max_extract_tokens: 1500
  injection_filter_enabled: true
  deduplication_threshold: 0.75

# ── EDA Tools & Verification ─────────────────
tools:
  execution_env: "native"    # "native" | "wsl"

  verilator:
    binary: "verilator"
    default_flags: ["--lint-only", "--Wall"]
    sim_flags: ["--cc", "--exe", "--build", "--trace"]
    timeout_seconds: 120

  cocotb:
    sim_build_dir: "./sim_build"
    simulator: "verilator"
    log_level: "INFO"
    timeout_seconds: 60

  yosys:
    binary: "yosys"
    default_target: "generic"     # "generic" | "ice40" | "ecp5" | "xilinx"
    timeout_seconds: 120

  formal:
    binary: "sby"
    default_engine: "smtbmc"
    bmc_depth: 20
    timeout_seconds: 60

  git:
    designs_repo: "./designs"
    auto_commit: true
    tag_on_success: true

# ── Evaluator & Modular Reward ───────────────
evaluator:
  mode: "modular"                 # "v1" | "modular"
  evaluation_mode: "research_fast" # "research_fast" | "research_strict"
  # Modular weights (sum to 1.0)
  reward_weights:
    correctness: 0.45             # compile + test pass rate
    formal: 0.15                  # formal verification pass
    area: 0.20                    # cell count / area score
    timing: 0.15                  # critical path ns
    power: 0.05                   # power estimate (only when reliable)

  # Thresholds for gates
  thresholds:
    compile_required: true        # hard gate: compile must pass
    functional_pass_min: 1.0      # hard gate: 100% functional tests required
    lint_warnings_max: 5
    area_target: 500.0            # um^2
    timing_target_ns: 5.0         # ns

  reward_phase: 1                 # 1 = correctness only, 2 = + synthesis

# ── Security & Sandboxing ────────────────────
security:
  workspace_only: true
  allowed_write_directories:
    - "./designs"
    - "./rtl/generated"
    - "./sim_build"
    - "./trajectories"
  protected_directories:
    - "evaluator"
    - "configs"
    - "tests"
    - "benchmarks/tests"
  allow_arbitrary_shell: false
  subprocess_timeout_seconds: 60

# ── Agent Loop ───────────────────────────────
agent:
  max_iterations: 25
  max_retries_per_step: 3
  early_stop_reward: 0.95
  log_level: "INFO"
  save_all_trajectories: true
  work_dir: "./rtl/generated"

# ── Learning Foundation (SFT / GRPO) ─────────
learning:
  min_episodes_for_sft: 100
  reward_threshold_for_sft: 0.7
  sft:
    learning_rate: 2.0e-5
    num_epochs: 3
    lora_r: 16
    lora_alpha: 32
    batch_size: 4
    output_dir: "./models/sft"
  grpo:
    group_size: 4
    learning_rate: 1.0e-5
    kl_coeff: 0.1
    output_dir: "./models/grpo"

# ── WebRL-Style Online Curriculum Self-Evolution ──
self_evolution:
  start_level: 1
  max_level: 7
  promotion_threshold: 0.80
  enable_task_generator: true
  generations: 5
  group_size: 4
  work_dir: "./sim_build/self_evolution"

