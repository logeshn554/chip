# Target Physical, Thermal, Power, and AI Performance Envelope
# Long-term research target: Independent Portable AI Computer

target_device:
  target_name: "Portable Independent AI Device"
  
  # Physical Enclosure Envelope (mm)
  enclosure:
    length_mm: 100.0
    width_mm: 30.0
    height_mm: 12.0
    pcb_layers: 6
    clearance_mm: 2.0

  # Power & Energy Envelope
  power:
    max_power_w: 5.0             # USB-C bus-powered limit (5V / 1A - 3A)
    idle_power_w: 0.5
    pmic_efficiency: 0.88

  # Thermal Management (Passive Cooling)
  thermal:
    max_junction_temp_c: 85.0    # Maximum silicon junction temp Tj_max
    ambient_temp_c: 30.0         # Nominal ambient operating temp
    thermal_resistance_c_per_w: 10.0  # Passive aluminum body dissipation theta_ja

  # Memory & Storage Subsystem
  memory:
    min_ram_gb: 8.0              # LPDDR4x/LPDDR5 8GB
    bus_width_bits: 32
    dram_clock_mhz: 2133.0       # LPDDR4x-4266
    min_storage_gb: 256.0        # UFS 3.1 / eMMC 256GB

  # Connectivity
  interface:
    type: "USB-C"
    protocol: "USB 3.2 Gen 2"
    bandwidth_gbps: 10.0

  # AI Workload & Performance Target
  workload:
    target_model: "Qwen-14B-INT4"
    parameters_billion: 14.0
    weight_quantization_bits: 4
    min_tokens_per_sec: 15.0     # Target interactive decoding speed
    max_first_token_latency_ms: 200.0
