[project]
name = "self-evolving-chip"
version = "0.1.0"
description = "A self-evolving hardware design agent powered by Qwen3-4B with memory, EDA tools, and a reward-driven learning loop."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # LLM
    "transformers>=4.51.0",
    "torch>=2.6.0",
    "accelerate>=0.30.0",
    "openai>=1.30.0",           # For vLLM OpenAI-compatible API

    # Memory / RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Web research
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",

    # RTL / Templates
    "jinja2>=3.1.0",

    # EDA tools (Python wrappers)
    "cocotb>=1.9.0",

    # Git
    "gitpython>=3.1.0",

    # Config / CLI
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
learning = [
    "trl>=0.9.0",
    "peft>=0.11.0",
    "datasets>=2.19.0",
    "bitsandbytes>=0.43.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
chip-agent = "main:cli"

[tool.setuptools.packages.find]
include = ["agent*", "memory*", "web*", "rtl*", "tools*", "evaluator*", "learning*"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
